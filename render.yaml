services:
  - type: web
    name: dengueguard-lk
    runtime: static
    repo: https://github.com/Visura13/dengueguard-lk
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
